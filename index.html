<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SearchLens — SEO &amp; AI-Search (GEO/AEO) Audit Tool</title>
<meta name="description" content="Free SEO, GEO &amp; AEO audit tool. Scan any page for classic SEO, technical health, and AI-search readiness.">
<link rel="canonical" href="https://searchlens.vercel.app/">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="theme-color" content="#5AB8F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0F15" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9F4FF; --surface:#FFFFFF; --surface-2:#D9ECFF; --raise:#CBE4FD;
  --ink:#0D1117; --ink-soft:#465A73; --ink-faint:#7C8DA6; --line:#CBE3FB;
  --blue:#5AB8F5; --blue-deep:#1287DE; --blue-soft:#E4F3FF;
  --yellow:#FFCB2D; --yellow-deep:#F2B705; --yellow-soft:#FFF3C9;
  --pass:#1E9E63; --pass-bg:#E3F6EC; --warn:#E6A50A; --warn-bg:#FFF4D6; --fail:#E64A34; --fail-bg:#FCE6E1;
  --sans:'Plus Jakarta Sans',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --r:20px; --r-md:14px; --r-sm:10px; --shadow:0 12px 40px -12px rgba(18,135,222,.28);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#0C0F15; --surface:#151A23; --surface-2:#1D2531; --raise:#26303E;
  --ink:#EAF2FB; --ink-soft:#93A4BC; --ink-faint:#61728C; --line:#26303E;
  --blue:#6CC4FF; --blue-deep:#3EA6F2; --blue-soft:#122234;
  --yellow:#FFD23F; --yellow-deep:#FFC21A; --yellow-soft:#2A2612;
  --pass:#3ECB84; --pass-bg:#10281d; --warn:#FFC21A; --warn-bg:#2a2410; --fail:#FF7059; --fail-bg:#2c1712;
  --shadow:0 16px 44px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
a{color:var(--blue-deep);text-decoration:none}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:66px}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--ink)}
.logo{width:34px;height:34px;border-radius:11px;background:var(--ink);position:relative;flex:none;overflow:hidden}
.tgl{background:var(--surface-2);border:1px solid var(--line);color:var(--ink-soft);width:40px;height:38px;border-radius:11px;cursor:pointer;font-size:16px}
.btn{font-family:var(--sans);font-weight:700;font-size:15px;border-radius:12px;padding:13px 22px;cursor:pointer;border:2px solid transparent;display:inline-flex;align-items:center;gap:8px}
.btn-y{background:var(--yellow);color:#141414;box-shadow:0 6px 0 var(--yellow-deep)}
.btn-y:hover{filter:brightness(1.03);transform:translateY(-1px)}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}

.hero{padding:50px 0 30px;text-align:center}
h1{font-size:clamp(32px,5vw,52px);font-weight:800;margin:0 0 16px}
h1 .hl{background:var(--yellow);color:#141414;padding:0 .12em;border-radius:6px}
.lede{color:var(--ink-soft);font-size:18px;max-width:55ch;margin:0 auto 24px}

section.blk{padding:40px 0}
.tool-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.tool-head{background:var(--ink);color:#fff;padding:18px 22px;display:flex;align-items:center;gap:12px}
.tool-head .dot3{display:flex;gap:6px}.tool-head .dot3 i{width:11px;height:11px;border-radius:50%}
.tool-head .dot3 i:nth-child(1){background:var(--fail)}.tool-head .dot3 i:nth-child(2){background:var(--yellow)}.tool-head .dot3 i:nth-child(3){background:var(--pass)}
.pad{padding:22px}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:5px;border-radius:12px;margin-bottom:14px;width:fit-content}
.tab{padding:9px 18px;border:none;background:transparent;color:var(--ink-soft);font-weight:700;font-size:14px;border-radius:9px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.1)}
textarea,input[type=url]{width:100%;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:14px;font-family:var(--mono);font-size:14px}
textarea{min-height:140px;resize:vertical}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}

#results{margin-top:26px}
.score-wrap{display:flex;gap:28px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px}
.gauge-score{font-size:48px;font-weight:800;color:var(--blue-deep)}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:12px}
.card.s-pass{border-left-color:var(--pass)}.card.s-warn{border-left-color:var(--warn)}.card.s-fail{border-left-color:var(--fail)}
.cname{font-weight:700;font-size:16px}
.ev{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 9px;margin-top:6px;display:inline-block}
.why{color:var(--ink-soft);font-size:14px;margin-top:6px}
footer{padding:30px 0;color:var(--ink-faint);font-size:13.5px;text-align:center;border-top:1px solid var(--line);margin-top:40px}
</style>
</head>
<body>
<nav><div class="wrap nav">
  <div class="brand"><span class="logo"></span>SearchLens</div>
  <button class="tgl" id="theme" title="Theme">◐</button>
</div></nav>

<header class="hero"><div class="wrap">
  <h1>Is your page ready for <span class="hl">Google &amp; AI</span> search?</h1>
  <p class="lede">Scan any URL or HTML to get an instant, dynamic SEO &amp; GEO audit score.</p>
</div></header>

<section class="blk" id="tool"><div class="wrap">
  <div class="tool-card">
    <div class="tool-head"><div class="dot3"><i></i><i></i><i></i></div><span>SearchLens Scanner</span></div>
    <div class="pad">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="false" id="tab-url">Enter URL</button>
        <button class="tab" role="tab" aria-selected="true" id="tab-html">Paste HTML</button>
      </div>
      
      <div id="pane-url" hidden>
        <input id="url" type="url" placeholder="https://example.com">
        <div class="row"><button class="btn btn-y" id="run-url" style="flex:1;justify-content:center">Scan URL</button></div>
      </div>

      <div id="pane-html">
        <textarea id="html" placeholder="Paste HTML code here..."></textarea>
        <div class="row"><button class="btn btn-y" id="run" style="flex:1;justify-content:center">Run Audit</button></div>
      </div>

      <div id="results"></div>
    </div>
  </div>
</div></section>

<footer class="wrap">SearchLens — Live Website Scanner</footer>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const root=document.documentElement;
$('#theme').onclick=()=>{const d=(root.getAttribute('data-theme')||'light')==='light';root.setAttribute('data-theme',d?'dark':'light')};

function selTab(isUrl){
  $('#tab-url').setAttribute('aria-selected',isUrl);
  $('#tab-html').setAttribute('aria-selected',!isUrl);
  $('#pane-url').hidden=!isUrl;
  $('#pane-html').hidden=isUrl;
}
$('#tab-url').onclick=()=>selTab(true);
$('#tab-html').onclick=()=>selTab(false);

function auditHTML(html){
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const checks = [];

  // 1. Title Check
  const title = doc.querySelector('title')?.textContent.trim() || '';
  checks.push({
    name: 'Title Tag',
    status: title && title.length >= 30 && title.length <= 60 ? 'pass' : (title ? 'warn' : 'fail'),
    evidence: title ? `"${title}" (${title.length} chars)` : 'Missing <title> tag',
    why: 'Title tag is crucial for Google and AI engines to understand page context.'
  });

  // 2. Meta Description
  const metaDesc = doc.querySelector('meta[name="description"]')?.getAttribute('content')?.trim() || '';
  checks.push({
    name: 'Meta Description',
    status: metaDesc && metaDesc.length >= 100 ? 'pass' : (metaDesc ? 'warn' : 'fail'),
    evidence: metaDesc ? `"${metaDesc.slice(0, 80)}..." (${metaDesc.length} chars)` : 'Missing meta description',
    why: 'Drives click-through rate from search engines.'
  });

  // 3. H1 Heading
  const h1s = $$('h1', doc);
  checks.push({
    name: 'H1 Heading',
    status: h1s.length === 1 ? 'pass' : (h1s.length > 1 ? 'warn' : 'fail'),
    evidence: h1s.length ? `${h1s.length} H1 found: "${h1s[0].textContent.trim().slice(0, 50)}"` : 'No H1 heading found',
    why: 'Pages should have exactly one main H1 heading.'
  });

  // 4. Canonical Tag
  const canonical = doc.querySelector('link[rel="canonical"]')?.getAttribute('href');
  checks.push({
    name: 'Canonical URL',
    status: canonical ? 'pass' : 'warn',
    evidence: canonical ? canonical : 'Missing canonical link',
    why: 'Prevents duplicate content issues.'
  });

  // 5. Open Graph Image
  const ogImg = doc.querySelector('meta[property="og:image"]')?.getAttribute('content');
  checks.push({
    name: 'Open Graph Image',
    status: ogImg ? 'pass' : 'warn',
    evidence: ogImg ? ogImg : 'Missing og:image tag',
    why: 'Important for social media sharing cards.'
  });

  // Calculate Real Dynamic Score
  const passCount = checks.filter(c => c.status === 'pass').length;
  const warnCount = checks.filter(c => c.status === 'warn').length;
  const score = Math.round(((passCount * 100) + (warnCount * 50)) / checks.length);

  return { score, checks };
}

function renderResults(res){
  const resDiv = $('#results');
  let cardsHTML = res.checks.map(c => `
    <div class="card s-${c.status}">
      <div class="cname">${c.status === 'pass' ? '✅' : (c.status === 'warn' ? '⚠️' : '❌')} ${c.name}</div>
      <div class="ev">${c.evidence}</div>
      <div class="why">${c.why}</div>
    </div>
  `).join('');

  resDiv.innerHTML = `
    <div class="score-wrap">
      <div>
        <div style="font-weight:700;color:var(--ink-soft)">Overall Score</div>
        <div class="gauge-score">${res.score}/100</div>
      </div>
    </div>
    <div style="margin-top:20px">${cardsHTML}</div>
  `;
}

// URL Scan handler
$('#run-url').onclick = async () => {
  const urlVal = $('#url').value.trim();
  if(!urlVal) return alert('Please enter a valid URL');
  
  $('#results').innerHTML = '<p style="text-align:center;font-weight:700;">Scanning website via backend API...</p>';

  try {
    const res = await fetch(`/api/scan?url=${encodeURIComponent(urlVal)}`);
    const data = await res.json();

    if(data.success && data.html) {
      const auditData = auditHTML(data.html);
      renderResults(auditData);
    } else {
      $('#results').innerHTML = `<p style="color:var(--fail);font-weight:700;">Scan Failed: ${data.message || 'Error fetching page'}</p>`;
    }
  } catch(e) {
    $('#results').innerHTML = `<p style="color:var(--fail);font-weight:700;">Error: ${e.message}</p>`;
  }
};

// HTML Paste Scan handler
$('#run').onclick = () => {
  const htmlVal = $('#html').value.trim();
  if(!htmlVal) return alert('Please paste HTML content');
  const auditData = auditHTML(htmlVal);
  renderResults(auditData);
};
</script>
</body>
</html>
