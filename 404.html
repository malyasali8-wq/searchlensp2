<style>
:root{--bg:#E9F4FF;--surface:#fff;--ink:#0D1117;--ink-soft:#465A73;--line:#CBE3FB;--blue:#5AB8F5;--blue-deep:#1287DE;--yellow:#FFCB2D;--yellow-deep:#F2B705;--sans:'Plus Jakarta Sans',system-ui,sans-serif;--r:18px;--shadow:0 12px 40px -12px rgba(18,135,222,.28)}
:root[data-theme="dark"]{--bg:#0C0F15;--surface:#151A23;--ink:#EAF2FB;--ink-soft:#93A4BC;--line:#26303E;--blue:#6CC4FF;--blue-deep:#3EA6F2;--yellow:#FFD23F;--yellow-deep:#FFC21A;--shadow:0 16px 44px -14px rgba(0,0,0,.6)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C0F15;--surface:#151A23;--ink:#EAF2FB;--ink-soft:#93A4BC;--line:#26303E;--blue:#6CC4FF;--blue-deep:#3EA6F2;--yellow:#FFD23F;--yellow-deep:#FFC21A;--shadow:0 16px 44px -14px rgba(0,0,0,.6)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.code{font-size:clamp(80px,20vw,160px);font-weight:800;letter-spacing:-.06em;background:linear-gradient(135deg,var(--blue),var(--yellow));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin:0}
h1{font-size:clamp(22px,4vw,32px);font-weight:800;margin:16px 0 8px}
p{color:var(--ink-soft);font-size:17px;max-width:44ch;margin:0 0 28px}
.links{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{font-family:var(--sans);font-weight:700;font-size:15px;border-radius:12px;padding:13px 24px;cursor:pointer;border:2px solid transparent;display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:transform .2s,box-shadow .2s}
.btn-y{background:var(--yellow);color:#141414;box-shadow:0 6px 0 var(--yellow-deep)}.btn-y:hover{transform:translateY(-2px)}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}.btn-ghost:hover{background:var(--surface);transform:translateY(-2px)}
footer{position:fixed;bottom:0;width:100%;padding:18px;color:var(--ink-soft);font-size:13px;text-align:center;border-top:1px solid var(--line)}
footer a{color:var(--ink-soft);margin:0 8px}
</style>
</head>

</div>
<footer>
